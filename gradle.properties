# Run Gradle itself on JDK 17.
#
# The sandbox default JDK is Java 25. Gradle 8.14.5's embedded Kotlin DSL script
# compiler (Kotlin 2.0.21) cannot parse the Java 25 version string and fails
# with "IllegalArgumentException: 25.0.2" while compiling the *.gradle.kts build
# scripts. JDK 17 is pre-installed and is the recommended runtime for AGP 8.7 /
# Gradle 8.14. If this path does not exist in your environment, remove this line
# (and/or set org.gradle.java.home to your JDK 17) so Gradle uses JAVA_HOME.
org.gradle.java.home=/opt/toolchains/.local/share/mise/installs/java/17.0.2

# Standard Android / Kotlin project settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
